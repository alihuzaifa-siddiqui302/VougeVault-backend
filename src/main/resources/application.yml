spring:
  application:
    name: VougeVault
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:dev-secret-key-not-for-production-use-only-local-testing-1234567890}
  expiration: 86400000

app:
  cors:
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
  email:
    from: ${APP_EMAIL_FROM:noreply@vougevault.com}
    from-name: ${APP_EMAIL_FROM_NAME:VougeVault}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:mock_stripe_secret}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:mock_stripe_publishable}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:mock_stripe_webhook}

sendgrid:
  api-key: ${SENDGRID_API_KEY:mock}